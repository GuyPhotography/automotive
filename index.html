<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Guy Arditi — Automotive Photo & Video</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;800&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0a0a0a;
            color: #e5e5e5;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }
        .font-cinzel { font-family: 'Cinzel', serif; }

        /* Custom Cursor for desktop devices only */
        @media (pointer: fine) {
            body { cursor: none; }
            #cursor-dot {
                width: 8px; height: 8px; background-color: #ffffff; border-radius: 50%;
                position: fixed; pointer-events: none; z-index: 9999;
                transform: translate(-50%, -50%); transition: transform 0.1s ease;
            }
            #cursor-ring {
                width: 40px; height: 40px; border: 1px solid rgba(255, 255, 255, 0.4); border-radius: 50%;
                position: fixed; pointer-events: none; z-index: 9998;
                transform: translate(-50%, -50%); transition: transform 0.15s ease-out, width 0.3s ease, height 0.3s ease, background-color 0.3s ease;
                display: flex; align-items: center; justify-content: center;
            }
            #cursor-text {
                font-size: 8px; font-weight: 700; letter-spacing: 1px; color: #000; opacity: 0;
                transition: opacity 0.2s ease; white-space: nowrap; text-transform: uppercase;
            }
            body.hover-target #cursor-ring { width: 85px; height: 85px; background-color: #ffffff; border-color: #ffffff; }
            body.hover-target #cursor-text { opacity: 1; }
            body.hover-target #cursor-dot { opacity: 0; }
        }

        /* Disable custom cursor on touch devices */
        @media (pointer: coarse) {
            #cursor-dot, #cursor-ring { display: none !important; }
            body { cursor: auto !important; }
        }

        /* Image hover effect */
        .card-image-wrapper { overflow: hidden; position: relative; }
        .card-image-wrapper img { transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1); }
        @media (pointer: fine) {
            .card-image-wrapper:hover img { transform: scale(1.06); }
        }
        
        /* Modal background blur */
        .modal-blur { backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); background-color: rgba(5, 5, 5, 0.94); }

        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; }
        ::-webkit-scrollbar-thumb { background: #262626; border-radius: 3px; }
    </style>
</head>
